<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d2b">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Benfeitorias em Campo</title>
<style>/*LEAFLET_CSS*/</style>
<style>
:root{--verde:#1f3d2b;--verde2:#2f5d40;--fundo:#f4f2ec;--card:#fff;--txt:#1c1f1d;--sub:#5d655f;--linha:#dcd8cc;--ok:#15803d;--alerta:#b45309;--erro:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--verde);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;min-height:56px;flex:none}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
header button{background:transparent;border:0;color:#fff;font-size:22px;width:40px;height:40px;border-radius:8px}
header button:active{background:rgba(255,255,255,.15)}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding:12px 12px 24px;display:none}
.view.on{display:block}
#vMapa{padding:0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#e9e6dc;background-image:linear-gradient(#ddd9cc 1px,transparent 1px),linear-gradient(90deg,#ddd9cc 1px,transparent 1px);background-size:40px 40px}
nav{display:none;background:#fff;border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav.on{display:flex}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--verde);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;background:var(--verde);color:#fff;font-weight:600;min-height:46px}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn.perigo{background:#fff;color:var(--erro);border:1.5px solid var(--erro)}
.btn.full{width:100%}
.btn:active{opacity:.8}
.card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px;margin-bottom:10px}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vazio{text-align:center;padding:40px 16px;color:var(--sub)}
.vazio .ico{font-size:48px}
h2{font-size:15px;margin:18px 0 8px;color:var(--verde);text-transform:uppercase;letter-spacing:.04em}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--linha);border-radius:9px;background:#fff;font-size:16px}
label.f textarea{min-height:80px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--verde2);border-color:transparent}
.proj{display:flex;gap:12px;align-items:center}
.proj .info{flex:1;min-width:0}
.proj .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra{height:6px;background:#e7e3d8;border-radius:3px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--ok)}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:0 -12px;padding-left:12px;padding-right:12px}
.chip{flex:none;border:1px solid var(--linha);background:#fff;border-radius:20px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.item{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.num{flex:none;min-width:34px;height:34px;border-radius:8px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0 4px}
.item .info{flex:1;min-width:0}
.item .nome{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.med{font-size:14px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.med span{white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:#eef0ec;color:var(--sub)}
.tag.ok{background:#dcfce7;color:#166534}
.tag.al{background:#fef3c7;color:#92400e}
.tag.camp{background:#dbeafe;color:#1e40af}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--linha);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.check.on{background:var(--ok);border-color:var(--ok)}
.fab{position:absolute;right:14px;bottom:18px;z-index:500;width:56px;height:56px;border-radius:50%;border:0;background:var(--verde);color:#fff;font-size:28px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.mapbtns{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapbtns button{width:44px;height:44px;border-radius:10px;border:1px solid var(--linha);background:#fff;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mapbtns button.on{background:var(--verde);color:#fff}
.lbl{background:none;border:0}
.lbl span{display:inline-block;transform:translate(-50%,-50%);color:#fff;font:700 12px system-ui;padding:2px 6px;border-radius:9px;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap}
.lbl span.ok::after{content:" ✓"}
/* sheet */
#sheet{position:fixed;inset:0;background:var(--fundo);z-index:2000;display:none;flex-direction:column}
#sheet.on{display:flex}
#sheet .corpo{flex:1;overflow:auto;padding:12px 12px 30px}
.medkml{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.medkml div{background:#f7f6f1;border-radius:8px;padding:8px 10px}
.medkml small{display:block;color:var(--sub);font-size:12px}
.medkml b{font-size:17px}
.adot{background:#1f3d2b;color:#fff;border-radius:12px;padding:12px;margin:12px 0}
.adot small{opacity:.8}
.adot b{font-size:22px;display:block}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fotos div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#ddd}
.fotos img{width:100%;height:100%;object-fit:cover}
.fotos div button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff}
.fotos .legf{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 4px;text-align:center;pointer-events:none}
.addfoto{display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px dashed var(--linha);border-radius:8px;aspect-ratio:1;color:var(--sub);font-size:13px;background:#fff}
.addfoto b{font-size:26px;font-weight:400}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .caixa{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
#modal h3{margin:0 0 10px}
#modal .acoes{display:flex;gap:8px;margin-top:14px}
#modal .acoes .btn{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:4000;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab td,.tab th{padding:6px 4px;border-bottom:1px solid var(--linha);text-align:left}
.tab td.n,.tab th.n{text-align:right;white-space:nowrap}
.exp .btn{margin-bottom:8px}
.hide{display:none!important}
.vh{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
label.btn{cursor:pointer}
#drop{position:fixed;inset:0;z-index:5000;background:rgba(31,61,43,.85);color:#fff;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;border:4px dashed #fff}
#drop.on{display:flex}
@media(min-width:760px){.view{padding:16px max(16px,calc(50% - 380px))}#sheet .corpo{padding:16px max(16px,calc(50% - 380px))}}
</style>
</head>

<header>
  <button id="bVoltar" class="hide" aria-label="Voltar">‹</button>
  <h1 id="titulo">Benfeitorias em Campo</h1>
  <button id="bMenu" class="hide" aria-label="Dados do processo">⋯</button>
</header>
<main>
  <section class="view on" id="vHome"></section>
  <section class="view" id="vLista"></section>
  <section class="view" id="vMapa"><div id="mapa"></div>
    <div class="mapbtns"><button id="bFit" title="Enquadrar">⤢</button><button id="bSat" title="Satélite (precisa de internet)">🛰</button><button id="bGps" title="Minha posição">📍</button></div>
  </section>
  <section class="view" id="vExp"></section>
</main>
<nav id="nav">
  <button data-v="vLista" class="on"><b>☰</b>Lista</button>

</nav>
<div id="sheet"></div>
<div id="modal"><div class="caixa"></div></div>

<input type="file" id="fKml" class="vh">
<input type="file" id="fBak" class="vh" accept=".json,application/json">
<input type="file" id="fFoto" class="vh" accept="image/*" multiple>

<script>/*LEAFLET_JS*/</script>
<script>
"use strict";
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=2)=>v==null||!isFinite(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const num=s=>{if(s==null)return null;s=String(s).trim().replace(/\s/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?v:null};
const inNum=v=>v==null?'':String(v).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const hoje=()=>new Date().toLocaleDateString('pt-BR');
function toast(m,t=2600){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),t)}
function fmtArea(m2){if(m2==null||!isFinite(m2))return '—';return m2>=10000?fmt(m2/1e4,4)+' ha':fmt(m2)+' m²'}

/* ============ tipos de benfeitoria ============ */
const TIPOS=[
 ['funcionario','Casa de funcionário','#f97316',/funcion|colono|caseiro|empregad|retiro/],
 ['residencia','Residência / Sede','#dc2626',/casa|sede|resid|moradia|chale/],
 ['galpao','Galpão / Barracão','#7c3aed',/galp|barrac|armaz|deposit|garage|maquin|oficina|almoxar|alpendre|rancho/],
 ['curral','Curral / Mangueira','#92400e',/curral|mangueir|tronco|embarcad|brete|balanca|seringa|apartad|lance/],
 ['estabulo','Estábulo / Cocheira','#a16207',/estabul|cocheir|baia|ordenh|leiteir/],
 ['aviario','Aviário / Pocilga','#db2777',/aviar|granja|frango|pocilg|chiqueir|suin/],
 ['silo','Silo / Secador / Paiol','#475569',/silo|secador|paiol|tulha/],
 ['agua','Poço / Caixa d\'água','#0284c7',/poco|artesian|caixa|reservat|cisterna|bebedour/],
 ['represa','Represa / Açude / Tanque','#2563eb',/represa|acude|tanque|lago|barragem|lagoa/],
 ['cerca','Cerca','#78350f',/cerca|divisa|aramado/],
 ['estrada','Estrada / Carreador','#6b7280',/estrada|carreador|acesso|caminho|aceiro/],
 ['rede','Rede elétrica','#eab308',/\brede\b|energia|eletric|poste|transform/],
 ['reserva','Reserva Legal','#15803d',/reserva|\brl\b/],
 ['app','APP','#0d9488',/\bapp\b|preserva/],
 ['pastagem','Pastagem','#65a30d',/pasto|pastage|invernada|piquete|braquiar/],
 ['lavoura','Lavoura','#ca8a04',/lavoura|soja|milho|cana|plantio|cultura|eucalipt/],
 ['perimetro','Perímetro do imóvel','#111827',/perimetr|limite|imovel|fazenda|gleba|area total|matricula|sitio|chacara/],
 ['outros','Outros','#64748b',null]
].map(([k,nome,cor,re])=>({k,nome,cor,re}));
const TIPO=Object.fromEntries(TIPOS.map(t=>[t.k,t]));
const GRANDES=new Set(['reserva','app','pastagem','lavoura','perimetro']);
function classifica(nome,pasta){
  for(const txt of [norm(nome),norm(pasta)]){if(!txt)continue;for(const t of TIPOS)if(t.re&&t.re.test(txt))return t.k}
  return 'outros';
}
const CONSERV=['','A – Novo','B – Entre novo e regular','C – Regular','D – Entre regular e reparos simples','E – Reparos simples','F – Entre reparos simples e importantes','G – Reparos importantes','H – Entre reparos importantes e sem valor','I – Sem valor (demolição)'];
const PADRAO=['','Rústico','Simples','Médio','Superior'];

/* ============ geodésia (plano topocêntrico local WGS84) ============ */
const RA=6378137,EF=1/298.257223563,E2=EF*(2-EF),RAD=Math.PI/180;
function projetor(lat0,lon0){
  const s=Math.sin(lat0*RAD),w=Math.sqrt(1-E2*s*s);
  const M=RA*(1-E2)/(w*w*w),N=RA/w,kx=N*Math.cos(lat0*RAD)*RAD,ky=M*RAD;
  return {f:p=>[(p[0]-lon0)*kx,(p[1]-lat0)*ky],inv:q=>[q[0]/kx+lon0,q[1]/ky+lat0]};
}
function projDe(pts){let a=0,b=0;pts.forEach(p=>{a+=p[0];b+=p[1]});return projetor(b/pts.length,a/pts.length)}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function shoe(r){let s=0;for(let i=0,n=r.length;i<n;i++){const a=r[i],b=r[(i+1)%n];s+=a[0]*b[1]-b[0]*a[1]}return s/2}
function hull(p){p=p.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(p.length<3)return p;const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}up.pop();lo.pop();return lo.concat(up)}
function retMin(pts){const h=hull(pts);if(h.length<3)return null;let best=null;for(let i=0;i<h.length;i++){const a=h[i],b=h[(i+1)%h.length];const L=dist(a,b);if(!L)continue;const ux=(b[0]-a[0])/L,uy=(b[1]-a[1])/L;let mnu=1e18,mxu=-1e18,mnv=1e18,mxv=-1e18;for(const q of h){const u=q[0]*ux+q[1]*uy,v=-q[0]*uy+q[1]*ux;mnu=Math.min(mnu,u);mxu=Math.max(mxu,u);mnv=Math.min(mnv,v);mxv=Math.max(mxv,v)}const A=(mxu-mnu)*(mxv-mnv);if(!best||A<best.A)best={A,d1:mxu-mnu,d2:mxv-mnv}}return best&&{comp:Math.max(best.d1,best.d2),larg:Math.min(best.d1,best.d2),A:best.A}}
function mede(it){
  const k={};
  if(it.g==='Polygon'){
    const P=projDe(it.c),r=it.c.map(P.f);
    let A=Math.abs(shoe(r));(it.holes||[]).forEach(hh=>A-=Math.abs(shoe(hh.map(P.f))));
    let per=0;for(let i=0;i<r.length;i++)per+=dist(r[i],r[(i+1)%r.length]);
    k.area=A;k.perim=per;k.nv=r.length;
    const m=retMin(r);if(m){k.comp=m.comp;k.larg=m.larg;k.ret=A/m.A}
  }else if(it.g==='LineString'){
    const P=projDe(it.c),r=it.c.map(P.f);let L=0;for(let i=1;i<r.length;i++)L+=dist(r[i-1],r[i]);k.len=L;
  }
  return k;
}
function rotulo(it){if(it.g==='Polygon'&&GRANDES.has(it.tipo)){return it.c.reduce((m,p)=>p[1]>m[1]?p:m,it.c[0])}return centro(it)}
function centro(it){if(!it.c||!it.c.length)return null;if(it.g==='Point')return it.c[0];if(it.g==='Polygon'){const P=projDe(it.c),r=it.c.map(P.f);let A=0,cx=0,cy=0;for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length],f=a[0]*b[1]-b[0]*a[1];A+=f;cx+=(a[0]+b[0])*f;cy+=(a[1]+b[1])*f}if(Math.abs(A)>1e-9)return P.inv([cx/(3*A),cy/(3*A)])}const m=Math.floor(it.c.length/2);return it.c[m]}
function dentro(pt,ring){if(!pt)return false;let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])ins=!ins}return ins}
const COB_OK=new Set(['curral','galpao','outros','estabulo']);
const CIRC=new Set(['curral','silo','represa','agua']);
const COMP_RE=/seringa|tronco|brete|embarc|balanc|cocho|bebedour|apartad|porteir/;
function meio(x){if(x.g!=='LineString')return centro(x);const P=projDe(x.c),r=x.c.map(P.f);let L=0;const d=[0];for(let i=1;i<r.length;i++){L+=dist(r[i-1],r[i]);d.push(L)}for(let i=1;i<r.length;i++)if(d[i]>=L/2){const t=(L/2-d[i-1])/((d[i]-d[i-1])||1);return P.inv([r[i-1][0]+(r[i][0]-r[i-1][0])*t,r[i-1][1]+(r[i][1]-r[i-1][1])*t])}return x.c[0]}
// Perímetro sem nome reconhecível (ex.: "1578.34", a área em ha): polígono "Outros" de 5 ha ou mais
// cujo nome é só um número, ou que envolve pelo menos metade das outras geometrias → vira "Perímetro do imóvel"
function autoPerimetro(itens){let n=0;
  for(const it of itens){if(it.g!=='Polygon'||it.tipo!=='outros'||((it.kml||{}).area||0)<50000)continue;
    const outros=itens.filter(x=>x!==it&&x.c&&x.c.length),dent=outros.filter(x=>dentro(meio(x),it.c)).length;
    const numerico=/^\s*[\d.,]+\s*(ha|m2|m²)?\s*$/i.test(it.nome||'');
    if(numerico||(outros.length>=2&&dent>=outros.length/2)){it.tipo='perimetro';n++}}
  return n}
function dentroCurral(cur,x){return x!==cur&&!x.cob&&!(x.div&&x.div.length)&&dentro(meio(x),cur.c)&&!(x.g==='Polygon'&&((x.kml||{}).area||0)>=((cur.kml||{}).area||0))}
function candidatosCob(cur,itens){return itens.filter(x=>x.g==='Polygon'&&COB_OK.has(x.tipo)&&!COMP_RE.test(norm(x.nome))&&dentroCurral(cur,x))}
function candidatosInt(cur,itens){return itens.filter(x=>dentroCurral(cur,x)&&(x.g==='LineString'?!['estrada','rede'].includes(x.tipo):true))}
function anexa(cur,x,itens){(cur.div=cur.div||[]).push({id:x.id,nome:x.nome,g:x.g,c:x.c,holes:x.holes||[],kml:x.kml||{},tipo:x.tipo});cur.fotos.push(...(x.fotos||[]));if(x.obs)cur.obs=(cur.obs?cur.obs+' | ':'')+x.obs;const i=itens.indexOf(x);if(i>=0)itens.splice(i,1)}
function solta(cur,d,itens){cur.div=cur.div.filter(y=>y!==d);const n=Math.max(0,...itens.map(i=>i.n))+1;itens.push({id:uid(),n,nome:d.nome,tipo:d.tipo||'outros',pasta:cur.pasta,desc:'',g:d.g,c:d.c,holes:d.holes,kml:d.kml,campo:{},conserv:'',padrao:'',obs:'',fotos:[],ok:false})}
function vincula(cur,x,itens){cur.cob={nome:x.nome,c:x.c,holes:x.holes||[],kml:x.kml||{},campo:x.campo||{},tipo:'',alt:null};cur.fotos.push(...(x.fotos||[]));if(x.obs)cur.obs=(cur.obs?cur.obs+' | ':'')+x.obs;const i=itens.indexOf(x);if(i>=0)itens.splice(i,1)}
function autoCob(itens){const cs=itens.filter(i=>i.tipo==='curral'&&i.g==='Polygon').sort((a,b)=>(b.kml.area||0)-(a.kml.area||0));for(const cur of cs){if(!itens.includes(cur))continue;
  if(!cur.cob){const k=candidatosCob(cur,itens).sort((a,b)=>(/cobert|telhad|coberto/.test(norm(b.nome))-/cobert|telhad|coberto/.test(norm(a.nome)))||b.kml.area-a.kml.area);if(k.length)vincula(cur,k[0],itens)}

function cobAdot(cob){const c=cob.campo||{};if(c.area!=null)return {v:c.area,src:'campo'};if(c.comp!=null&&c.larg!=null)return {v:c.comp*c.larg,src:'campo'};return {v:cob.kml.area??null,src:'KML'}}

function linCurral(it){const c=it.campo||{};const vaos=c.lances??c.nPal;const calc=vaos&&c.espPal?vaos*c.espPal:null;const L=c.compLin??calc;return {L,calc,vaos,reg:L!=null&&c.reguas?L*c.reguas:null}}
const FORMATOS={retangular:'Retangular',quadrado:'Quadrado',circular:'Circular',semicircular:'Semicircular',irregular:'Irregular'};

function totais(itens){itens=itens||PROJ.itens;let area=0,n=0,cob=0,cerca=0;for(const it of itens){const a=adotada(it);if(!a.lin&&a.v!=null&&!GRANDES.has(it.tipo)){area+=a.v;n++}if(it.cob){const b=cobAdot(it.cob);if(b.v)cob+=b.v}if(a.lin&&it.tipo==='cerca'&&a.v)cerca+=a.v}return {area,n,cob,cerca}}

/* ============ ZIP (leitura KMZ / escrita KMZ e XLSX) ============ */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
const enc=new TextEncoder();
function zip(files){ // [{name, data:Uint8Array|string}]
  const parts=[],cent=[];let off=0;
  const d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){
    const nm=enc.encode(f.name),dat=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(dat);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,dat.length,true);h.setUint32(22,dat.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,dat);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,dat.length,true);c.setUint32(24,dat.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cent.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+dat.length;
  }
  const cs=cent.reduce((s,p)=>s+p.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cent,new Uint8Array(e.buffer)],{type:'application/zip'});
}
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let eo=-1;
  for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--)if(dv.getUint32(i,true)===0x06054b50){eo=i;break}
  if(eo<0)throw new Error('KMZ inválido');
  const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const out=[];
  for(let i=0;i<n;i++){
    const met=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    out.push({name,get:async()=>{const ln=dv.getUint16(lo+26,true),lx=dv.getUint16(lo+28,true),st=lo+30+ln+lx,raw=u.slice(st,st+cs);
      if(met===0)return raw;if(met!==8)throw new Error('Compressão não suportada');
      if(typeof DecompressionStream==='undefined')throw new Error('Este navegador não abre KMZ; exporte como KML no Google Earth');
      return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}});
  }
  return out;
}

/* ============ leitura KML ============ */
function porNome(el,n){return [...el.getElementsByTagName('*')].filter(e=>e.localName===n)}
function filho(el,n){for(const c of el.children)if(c.localName===n)return c;return null}
function txtFilho(el,n){const c=filho(el,n);return c?c.textContent.trim():''}
function coords(s){return s.trim().split(/\s+/).map(t=>t.split(',').map(Number)).filter(p=>p.length>=2&&isFinite(p[0])&&isFinite(p[1])).map(p=>[p[0],p[1]])}
function fechaAnel(c){if(c.length>1){const a=c[0],b=c[c.length-1];if(Math.abs(a[0]-b[0])<1e-10&&Math.abs(a[1]-b[1])<1e-10)c=c.slice(0,-1)}return c}
function lerKml(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Arquivo KML com erro de leitura');
  const docEl=porNome(doc,'Document')[0];const nomeDoc=docEl?txtFilho(docEl,'name'):'';
  const itens=[];
  for(const pm of porNome(doc,'Placemark')){
    const nome=txtFilho(pm,'name')||'Sem nome';let desc=txtFilho(pm,'description').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    const pastas=[];let e=pm.parentElement;while(e){if(e.localName==='Folder'){const n=txtFilho(e,'name');if(n)pastas.unshift(n)}e=e.parentElement}
    const pasta=pastas.join(' / ');
    const geoms=[];
    porNome(pm,'Polygon').forEach(pg=>{const ob=porNome(pg,'outerBoundaryIs')[0];if(!ob)return;const cc=porNome(ob,'coordinates')[0];if(!cc)return;const c=fechaAnel(coords(cc.textContent));if(c.length<3)return;const holes=porNome(pg,'innerBoundaryIs').map(ib=>{const x=porNome(ib,'coordinates')[0];return x?fechaAnel(coords(x.textContent)):[]}).filter(h=>h.length>=3);geoms.push({g:'Polygon',c,holes})});
    porNome(pm,'LineString').forEach(ls=>{const cc=porNome(ls,'coordinates')[0];if(!cc)return;const c=coords(cc.textContent);if(c.length>=2)geoms.push({g:'LineString',c})});
    porNome(pm,'LinearRing').forEach(lr=>{if(lr.parentElement&&/BoundaryIs$/.test(lr.parentElement.localName))return;const cc=porNome(lr,'coordinates')[0];if(!cc)return;const c=fechaAnel(coords(cc.textContent));if(c.length>=3)geoms.push({g:'Polygon',c,holes:[]})});
    porNome(pm,'Point').forEach(pt=>{const cc=porNome(pt,'coordinates')[0];if(!cc)return;const c=coords(cc.textContent);if(c.length)geoms.push({g:'Point',c:[c[0]]})});
    geoms.forEach((g,i)=>{
      const tipo=classifica(nome,pasta);
      // caminho fechado desenhado como linha => polígono (exceto cercas/estradas/redes)
      if(g.g==='LineString'&&g.c.length>=4&&!['cerca','estrada','rede'].includes(tipo)){const a=g.c[0],b=g.c[g.c.length-1];if(Math.abs(a[0]-b[0])<1e-9&&Math.abs(a[1]-b[1])<1e-9){g.g='Polygon';g.c=fechaAnel(g.c);g.holes=[]}}
      itens.push({id:uid(),nome:geoms.length>1?`${nome} (${i+1})`:nome,tipo,pasta,desc,g:g.g,c:g.c,holes:g.holes||[],campo:{},conserv:'',padrao:'',obs:'',fotos:[],ok:false});
    });
  }
  return {nomeDoc,itens};
}
async function lerArquivoGeo(file){
  const buf=await file.arrayBuffer(),u=new Uint8Array(buf);
  if(u[0]===0x50&&u[1]===0x4b){const ents=await unzip(buf);const k=ents.find(e=>/(^|\/)doc\.kml$/i.test(e.name))||ents.find(e=>/\.kml$/i.test(e.name));if(!k)throw new Error('KMZ sem arquivo KML dentro');return lerKml(new TextDecoder().decode(await k.get()))}
  return lerKml(new TextDecoder().decode(u));
}

async function importa(f){

    const r=await lerArquivoGeo(f);if(!r.itens.length)throw new Error('Nenhuma geometria encontrada no arquivo');

function resumoTipos(p){const c={};p.itens.forEach(i=>c[i.tipo]=(c[i.tipo]||0)+1);return Object.entries(c).map(([k,n])=>`${n} ${TIPO[k].nome.split(' /')[0].toLowerCase()}`).join(', ')}

function linhaMedidas(it){
  const k=it.kml||{},a=adotada(it),d=difPct(a);let s='';
  if(it.g==='Polygon'){s+=`<span>KML ${fmtArea(k.area)}${k.ret>0.85&&k.area<20000?` <span class="muted">(${fmt(k.comp,1)} × ${fmt(k.larg,1)})</span>`:''}</span>`}
  else if(it.g==='LineString')s+=`<span>KML ${fmt(k.len)} m</span>`;
  else if(it.g==='Point')s+=`<span class="muted">ponto</span>`;else s+=`<span class="muted">levantado em campo</span>`;

  const T=q=>[ox+(q[0]-mx)*s,H-oy-(q[1]-my)*s],sg=shoe(k.r)>=0?1:-1;
  let g=`<path d="M${p.map(q=>T(q).map(v=>v.toFixed(1)).join(',')).join('L')}${k.fechada?'Z':''}" fill="${k.fechada?'#dc262622':'none'}" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round"/>`;
  g+=`<circle cx="${T(p[0])[0]}" cy="${T(p[0])[1]}" r="4" fill="#15803d"/>`;
  if(!k.fechada&&p.length>1)g+=`<line x1="${T(p[p.length-1])[0]}" y1="${T(p[p.length-1])[1]}" x2="${T(p[0])[0]}" y2="${T(p[0])[1]}" stroke="#888" stroke-dasharray="4 4"/>`;
  if(cotas){const caixas=[]; // cotas: lado vertical com texto ao lado, horizontal acima/abaixo; se encostar em outra, afasta para fora
    pl.lados.forEach((l,i)=>{if(!l.m)return;const a=T(p[i]),b=T(p[i+1]),v=DIRS[l.d],nx=v[1]*sg,ny=v[0]*sg,vert=v[1]!==0,txt=fmt(l.m),fs=Math.hypot(b[0]-a[0],b[1]-a[1])<24?9:11,w=txt.length*fs*0.55,h=fs;

async function ancora(it,pos){

  if(typeof MAP!=='undefined'&&MAP){const c=MAP.getCenter();return [c.lng,c.lat]}

function descAcab(it){const a=it.acab||{},lo=x=>x?x.trim().replace(/^./,c=>c.toLowerCase()):'',p=[];

async function reduzFoto(file,max=1600){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Imagem não suportada'));i.src=URL.createObjectURL(file)});

  cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
}

    if(it.cob)g+=`<path d="M${it.cob.c.map(T).map(p=>p.join(',')).join('L')}Z" fill="${t.cor}" fill-opacity="0.7" stroke="${t.cor}" stroke-width="1" stroke-dasharray="3 2"/>`;
    if(it.g==='LineString')g+=`<polyline points="${it.c.map(T).map(p=>p.join(',')).join(' ')}" fill="none" stroke="${t.cor}" stroke-width="1.6"/>`;
    else{const p=T(it.c[0]);g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${t.cor}" stroke="#fff"/>`}
    const c=T(rotulo(it));lb+=`<g transform="translate(${c[0]},${c[1]})"><circle r="8" fill="#fff" stroke="${t.cor}" stroke-width="1.5"/><text text-anchor="middle" dy="3.2" font-size="9" font-weight="700" fill="#111">${it.n}</text></g>`}
  // escala
  const alvo=(W*0.25)/s,base=Math.pow(10,Math.floor(Math.log10(alvo))),mul=[1,2,5].reduce((m,v)=>v*base<=alvo?v:m,1),L=mul*base,Lp=L*s;
  const escala=`<g transform="translate(14,${H-16})"><rect width="${Lp/2}" height="5" fill="#111"/><rect x="${Lp/2}" width="${Lp/2}" height="5" fill="#fff" stroke="#111" stroke-width=".6"/><rect width="${Lp}" height="5" fill="none" stroke="#111" stroke-width=".6"/><text y="-3" font-size="8">0</text><text x="${Lp}" y="-3" font-size="8" text-anchor="end">${L>=1000?L/1000+' km':L+' m'}</text></g>`;
  const norte=`<g transform="translate(${W-22},26)"><path d="M0,-16 L7,8 L0,3 L-7,8Z" fill="#111"/><text y="-19" text-anchor="middle" font-size="10" font-weight="700">N</text></g>`;
  return `<figure class="cq"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif"><rect width="${W}" height="${H}" fill="#fff" stroke="#999"/>${g}${lb}${escala}${norte}</svg><figcaption>${esc0(titulo)}</figcaption></figure>`;
}

.cq{margin:8px 0;page-break-inside:avoid}.cq svg{width:100%;height:auto}figcaption{font-size:9pt;text-align:center;margin-top:3px}.leg{font-size:8.5pt;display:flex;flex-wrap:wrap;gap:4px 12px}.leg i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle}

async function exporta(t){
  const nm=slug(PROJ.nome)+'_benfeitorias';
  try{
    if(t==='xlsx')return baixa(nm+'.xlsx',geraXlsx());
    if(t==='kml'){const r=await geraKml(false);return baixa(nm+'.kml',new Blob([r.kml],{type:'application/vnd.google-earth.kml+xml'}))}
    if(t==='kmz'){toast('Montando KMZ…');const r=await geraKml(true);return baixa(nm+'.kmz',zip([{name:'doc.kml',data:r.kml},...r.fotos]))}
    if(t==='bak'){toast('Gerando backup…');return baixa(nm+'_backup.json',await backup())}
    if(t==='pdf'){
      let w=null;if(!NA_CLAUDE){try{w=window.open('','_blank')}catch(e){}}
      toast('Montando relatório…');const html=await geraRelatorio();
      if(w){w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},700)}
      else baixa(nm+'_relatorio.html',new Blob([html],{type:'text/html'}));
    }
  }catch(e){toast('Erro: '+e.message,4000)}
}
